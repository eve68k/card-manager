name: CI
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm/action-setup と setup-node ではなく mise.toml を読ませ、手元と同じ Node / pnpm に揃える
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type check
        run: pnpm exec tsc --noEmit -p .
      - name: Test
        run: pnpm exec vp test run
      # void deploy には dry-run がなく、void db reset は破壊的変更の検査を通さないため、空のローカル D1 への migrate で検査させる
      - name: Validate migrations
        run: pnpm exec void db migrate
      - name: Build
        run: pnpm build
